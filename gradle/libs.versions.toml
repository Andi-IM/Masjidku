[versions]
javafx = "21"
validatorfx = "0.5.0"
mysql = "8.0.28"
sqlite = "3.42.0.0"
openpdf = "1.3.26"
jasperreports = "7.0.6"
jaxb-api = "2.3.1"
junit = "4.13.2"
guava = "32.0.1-jre"
archunit = "1.2.1"
slf4j = "2.0.12"
logback = "1.5.13"
annotation = "24.1.0"
hibernate = "6.4.4.Final"
hikaricp = "5.1.0"
dagger = "2.51.1"
jboss-logging = "3.5.3.Final"
jakarta-transaction = "2.0.1"
jakarta-interceptor = "2.1.0"
jakarta-cdi = "4.0.1"
[libraries]
validatorfx = { group = "net.synedra", name = "validatorfx", version.ref = "validatorfx" }
# Database
mysql-connector = { group = "mysql", name = "mysql-connector-java", version.ref = "mysql" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }

# Reporting
openpdf = { group = "com.github.librepdf", name = "openpdf", version.ref = "openpdf" }
jasperreports = { group = "net.sf.jasperreports", name = "jasperreports", version.ref = "jasperreports" }
jasperreports-pdf = { group = "net.sf.jasperreports", name = "jasperreports-pdf", version.ref = "jasperreports" }
# XML Bind
jaxb-api = { group = "javax.xml.bind", name = "jaxb-api", version.ref = "jaxb-api" }

# Utilities
jetbrains-annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotation" }

guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }

# Hibernate ORM
hibernate-core = { group = "org.hibernate.orm", name = "hibernate-core", version.ref = "hibernate" }
hibernate-community-dialects = { group = "org.hibernate.orm", name = "hibernate-community-dialects", version.ref = "hibernate" }
hibernate-hikaricp = { group = "org.hibernate.orm", name = "hibernate-hikaricp", version.ref = "hibernate" }
hikaricp = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikaricp" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
archunit-junit5 = { group = "com.tngtech.archunit", name = "archunit-junit5", version.ref = "archunit" }

# logging
slf4j = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
logback = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }

# Dagger 2
dagger = { group = "com.google.dagger", name = "dagger", version.ref = "dagger" }
dagger-compiler = { group = "com.google.dagger", name = "dagger-compiler", version.ref = "dagger" }

# Jakarta & Jboss
jboss-logging = { group = "org.jboss.logging", name = "jboss-logging", version.ref = "jboss-logging" }
jakarta-transaction = { group = "jakarta.transaction", name = "jakarta.transaction-api", version.ref = "jakarta-transaction" }
jakarta-interceptor = { group = "jakarta.interceptor", name = "jakarta.interceptor-api", version.ref = "jakarta-interceptor" }
jakarta-cdi = { group = "jakarta.enterprise", name = "jakarta.enterprise.cdi-api", version.ref = "jakarta-cdi" }
[plugins]
javafx = { id = "org.openjfx.javafxplugin", version = "0.1.0" }
jlink = { id = "org.beryx.jlink", version = "3.0.0" }

