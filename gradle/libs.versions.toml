[versions]
javafx = "21"
mysql = "8.0.28"
sqlite = "3.42.0.0"
openpdf = "1.3.26"
jasperreports = "7.0.6"
jaxb-api = "2.3.1"
junit = "4.13.2"
guava = "32.0.1-jre"
archunit = "1.2.1"
slf4j = "2.0.12"
logback = "1.5.13"
annotation = "24.1.0"
hibernate = "6.4.4.Final"
[libraries]
# Database
mysql-connector = { group = "mysql", name = "mysql-connector-java", version.ref = "mysql" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }

# Reporting
openpdf = { group = "com.github.librepdf", name = "openpdf", version.ref = "openpdf" }
jasperreports = { group = "net.sf.jasperreports", name = "jasperreports", version.ref = "jasperreports" }
jasperreports-pdf = { group = "net.sf.jasperreports", name = "jasperreports-pdf", version.ref = "jasperreports" }
# XML Bind
jaxb-api = { group = "javax.xml.bind", name = "jaxb-api", version.ref = "jaxb-api" }

# Utilities
jetbrains-annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotation" }

guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }

# Hibernate ORM
hibernate-core = { group = "org.hibernate.orm", name = "hibernate-core", version.ref = "hibernate" }
hibernate-community-dialects = { group = "org.hibernate.orm", name = "hibernate-community-dialects", version.ref = "hibernate" }
# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
archunit-junit5 = { group = "com.tngtech.archunit", name = "archunit-junit5", version.ref = "archunit" }

# logging
slf4j = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
logback = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }


[plugins]
javafx = { id = "org.openjfx.javafxplugin", version = "0.1.0" }
jlink = { id = "org.beryx.jlink", version = "3.0.0" }

