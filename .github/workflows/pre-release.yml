name: Pre-Release Build

on:
  push:
    branches:
      - development
      - development-modular
    paths:
      - '**.java'
      - '**/build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:

jobs:
  build-exe:
    name: Build Windows Executable (Pre-Release)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build Executable with JPackage
        run: ./gradlew :masjidku-app:jpackage
        shell: cmd

      - name: Upload Pre-Release Executable
        uses: actions/upload-artifact@v4
        with:
          name: Masjidku-App-Windows-PreRelease
          path: masjidku-app/build/installers/*.exe
