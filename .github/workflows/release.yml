name: Release

on:
  push:
    branches:
      - production
    paths:
      - '**.java'
      - '**/build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'

env:
  DB_DATABASE: masjidku
  DB_USER: root
  DB_PASSWORD: root

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up MySQL
        run: |
          sudo /etc/init.d/mysql start
          mysql -e 'CREATE DATABASE ${{ env.DB_DATABASE }};' -u${{ env.DB_USER }} -p${{ env.DB_PASSWORD }}

      - name: Verify MySQL Connection
        run: |
          while ! mysqladmin ping -u"${{ env.DB_USER }}" -p"${{ env.DB_PASSWORD }}" --silent; do
            sleep 1
          done

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test with Gradle
        run: ./gradlew build

      - name: Install Semantic Release & Plugins
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github @semantic-release/exec

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  build-exe:
    name: Build Windows Executable
    runs-on: windows-latest
    needs: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build Executable with JPackage
        run: ./gradlew :masjidku-app:jpackage --no-daemon
        shell: cmd

      - name: Upload Executable to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Masjidku-App-Windows
          path: masjidku-app/build/installers/*.exe

      - name: Get Latest Tag
        id: get_tag
        uses: actions/github-script@v7
        with:
          script: |
            const tags = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });
            return tags.data[0]?.name;
          result-encoding: string

      - name: Upload to GitHub Release
        if: steps.get_tag.outputs.result != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.result }}
          files: masjidku-app/build/installers/*.exe
