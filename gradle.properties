# Gradle Daemon JVM — use Java 24 (system JDK).
# Gradle 8.14 supports up to Java 24; the IntelliJ JBR (Java 25) is too new
# for the embedded Groovy compiler in Gradle 8.x Groovy DSL.
# The project itself still compiles targeting Java 21 (see build.gradle).
# Note: org.gradle.java.home should be configured in your global ~/.gradle/gradle.properties.

# Gradle daemon JVM args:
# --enable-native-access=ALL-UNNAMED  → suppresses the System::load warning
#   from native-platform (Gradle's own tooling library) on JDK 24+
org.gradle.jvmargs=-Xmx512m --enable-native-access=ALL-UNNAMED
